<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art, Algorithms, and Ownership | JURIX 2026 Tutorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: rgba(18, 24, 38, 0.7);
      --border-card: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --gradient-primary: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --gradient-glow: linear-gradient(135deg, rgba(0,242,254,0.15) 0%, rgba(139,92,246,0.15) 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.7;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 65%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      padding-bottom: 4rem;
    }

    /* Header / Hero */
    header {
      padding: 5rem 1.5rem 3.5rem 1.5rem;
      text-align: center;
      position: relative;
      border-bottom: 1px solid var(--border-card);
      background: radial-gradient(ellipse at top, rgba(30, 41, 59, 0.5), transparent);
    }

    .conference-badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: var(--accent-cyan);
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 4.5vw, 3.4rem);
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 950px;
      margin: 0 auto 1.5rem auto;
    }

    .subtitle {
      color: var(--accent-cyan);
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .author-card {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      backdrop-filter: blur(10px);
    }

    .author-card a {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .author-card a:hover { opacity: 0.8; }

    /* Layout Container */
    .container {
      max-width: 1100px;
      margin: 3rem auto 0 auto;
      padding: 0 1.5rem;
    }

    /* Cards & Sections */
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 2.2rem;
      margin-bottom: 2.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: var(--gradient-primary);
      opacity: 0.7;
    }

    section-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 1.5rem;
    }

    /* Grid layout */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
    }
    @media (max-width: 850px) { .grid-2 { grid-template-columns: 1fr; } }

    /* Key Metrics / Highlights */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-top: 1.5rem;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-card);
      padding: 1.2rem;
      border-radius: 12px;
      border-left: 3px solid var(--accent-cyan);
    }
    .stat-box h4 { color: var(--accent-cyan); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-box p { color: var(--text-main); font-weight: 600; font-size: 1.05rem; margin-top: 0.3rem; }

    /* Accordion Timeline */
    .accordion-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      margin-bottom: 1rem;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .accordion-item:hover { border-color: rgba(0, 242, 254, 0.3); }
    .accordion-header {
      padding: 1.2rem 1.5rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      user-select: none;
    }
    .accordion-header .time-pill {
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .accordion-body {
      padding: 0 1.5rem 1.5rem 1.5rem;
      display: none;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(0, 0, 0, 0.2);
    }
    .accordion-body ul { margin-left: 1.2rem; margin-top: 0.8rem; }
    .accordion-body li { margin-bottom: 0.4rem; }

    /* Interactive Policy Lab (Quad Selector) */
    .quad-nav {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .quad-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-card);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s;
    }
    .quad-btn:hover, .quad-btn.active {
      background: var(--gradient-primary);
      color: #000;
      border-color: transparent;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    .quad-content-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 1.5rem;
      min-height: 160px;
    }

    /* Bibliography Section */
    .bibo-controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 250px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-card);
      color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      outline: none;
    }
