<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art, Algorithms, and Ownership | JURIX 2026 Tutorial</title>
  <style>
    :root {
      --bg-body: #f8f3e6;
      --bg-card: #fcf8f0;
      --bg-card-alt: #f3ebd9;
      --text-main: #221c18;
      --text-muted: #5a5047;
      --border-warm: #e2d5c3;
      --border-dark: #8c7a6b;
      --accent-terracotta: #a84323;
      --accent-sage: #2d4c38;
      --accent-navy: #1b365d;
      --shadow-paper: 0 4px 20px rgba(60, 45, 30, 0.06);
      --focus-ring: #005fcc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: Cambria, 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.75;
      padding-bottom: 5rem;
      -webkit-font-smoothing: antialiased;
    }

    /* Accessibility Skip Link */
    .skip-link {
      position: absolute;
      top: -50px;
      left: 10px;
      background: var(--accent-navy);
      color: #ffffff;
      padding: 0.75rem 1.25rem;
      z-index: 100;
      text-decoration: none;
      font-family: sans-serif;
      font-weight: bold;
      border-radius: 0 0 4px 4px;
      transition: top 0.2s;
    }
    .skip-link:focus {
      top: 0;
    }

    /* Universal Focus States for Accessibility */
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    /* Header & Hero Section */
    header {
      background-color: #f2e9d8;
      border-bottom: 2px solid var(--border-warm);
      padding: 4.5rem 1.5rem 3.5rem 1.5rem;
      text-align: center;
      position: relative;
    }

    header::after {
      content: '';
      display: block;
      width: 120px;
      height: 3px;
      background: var(--accent-terracotta);
      margin: 2rem auto 0 auto;
      border-radius: 2px;
    }

    .venue-badge {
      display: inline-block;
      font-family: Cambria, serif;
      font-style: italic;
      color: var(--accent-terracotta);
      font-size: 1.05rem;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }

    h1 {
      font-family: Cambria, 'Georgia', serif;
      font-size: clamp(2.1rem, 4vw, 3.1rem);
      font-weight: normal;
      line-height: 1.25;
      color: var(--text-main);
      max-width: 920px;
      margin: 0 auto 1.2rem auto;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--accent-navy);
      font-style: italic;
      margin-bottom: 2rem;
    }

    .author-box {
      display: inline-block;
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      padding: 0.75rem 1.8rem;
      border-radius: 4px;
      font-size: 1.05rem;
      box-shadow: var(--shadow-paper);
    }

    .author-box a {
      color: var(--accent-terracotta);
      text-decoration: underline;
    }

    /* Main Container */
    main {
      max-width: 960px;
      margin: 3.5rem auto 0 auto;
      padding: 0 1.5rem;
    }

    /* Paper Cards */
    .paper-card {
      background: var(--bg-card);
      border: 1px solid var(--border-warm);
      border-radius: 6px;
      padding: 2.25rem;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-paper);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      border-bottom: 1px solid var(--border-warm);
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .section-title h2 {
      font-size: 1.65rem;
      color: var(--accent-navy);
      font-weight: normal;
    }

    .section-icon {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--accent-terracotta);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Key Information Highlight Grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.2rem;
      margin-top: 1.8rem;
    }

    .info-box {
      background: var(--bg-card-alt);
      border-left: 4px solid var(--accent-terracotta);
      padding: 1.1rem;
      border-radius: 0 4px 4px 0;
    }

    .info-box h3 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-terracotta);
      margin-bottom: 0.25rem;
      font-weight: bold;
    }

    .info-box p {
      font-size: 1.05rem;
      color: var(--text-main);
    }

    /* Resources Section */
    .resource-card {
      background: #fffdfa;
      border: 1px solid var(--border-warm);
      border-left: 4px solid var(--accent-sage);
      border-radius: 4px;
      padding: 1.5rem;
      margin-top: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
    }

    .resource-info {
      flex: 1;
      min-width: 280px;
    }

    .resource-tag {
      display: inline-block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #e2ece9;
      color: var(--accent-sage);
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .resource-info h3 {
      font-size: 1.25rem;
      color: var(--accent-navy);
      margin-bottom: 0.4rem;
      font-weight: normal;
    }

    .resource-info p {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .resource-meta {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--accent-navy);
      color: #ffffff;
      padding: 0.8rem 1.4rem;
      border-radius: 4px;
      text-decoration: none;
      font-family: Cambria, serif;
      font-size: 1.05rem;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background: #0d2240;
    }

    /* Agenda Accordion */
    .accordion-item {
      border: 1px solid var(--border-warm);
      background: #fffdfa;
      border-radius: 4px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .accordion-header {
      width: 100%;
      text-align: left;
      padding: 1.2rem 1.5rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      font-family: Cambria, serif;
      color: var(--text-main);
      background: #faf4e8;
      border: none;
      transition: background 0.2s;
    }

    .accordion-header:hover {
      background: #f2e7d3;
    }

    .time-badge {
      font-size: 0.85rem;
      background: var(--accent-sage);
      color: #ffffff;
      padding: 0.25rem 0.65rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .accordion-body {
      padding: 1.5rem;
      display: none;
      border-top: 1px solid var(--border-warm);
      background: var(--bg-card);
      color: var(--text-muted);
    }

    .accordion-body ul {
      margin-left: 1.5rem;
      margin-top: 0.75rem;
    }

    .accordion-body li {
      margin-bottom: 0.5rem;
    }

    .quad-tabs {
      display: flex;
      gap: 0.6rem
